<svg class="silk-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="map-title map-description">
<title id="map-title">강동 주변 시험용 개념도</title>
<desc id="map-description">형주와 강동 사이의 장강을 표시합니다. 축척, 병력, 실시간 위치는 포함하지 않습니다.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b1a585" stroke-width=".5"/></pattern>
<linearGradient id="map-paper"><stop stop-color="#d8cda9"/><stop offset=".5" stop-color="#eee3c4"/><stop offset="1" stop-color="#d1c5a1"/></linearGradient>
<clipPath id="map-edge"><rect width="1000" height="300"/></clipPath>
</defs>
<g clip-path="url(#map-edge)">
<rect width="1000" height="300" fill="url(#map-paper)"/>
<rect width="1000" height="300" fill="url(#grid)"/>
<rect x="13" y="13" width="974" height="274" fill="none" stroke="#9f916b" stroke-width=".8"/>
<path d="M-20 110C140 85 225 207 390 164S665 103 784 181S973 207 1030 172" stroke="#819b94" stroke-width="33" fill="none"/>
<path d="M-20 110C140 85 225 207 390 164S665 103 784 181S973 207 1030 172" stroke="#cad9bf" stroke-width="2" fill="none"/>
<g fill="#687758" opacity=".3"><path d="M90 62l25-32 25 32 23-24 24 24z"/><path d="M635 70l25-32 25 32 23-24 24 24z"/><path d="M250 261l25-32 25 32 23-24 24 24z"/></g>
<g fill="#34413b" font-family="Malgun Gothic, sans-serif"><text x="205" y="110" font-size="25" letter-spacing="4">형주</text><text x="472" y="149" font-size="16" letter-spacing="8">장강</text></g>
<g id="map-jingzhou" class="map-marker"><rect x="182" y="76" width="140" height="48" fill="transparent"/><circle cx="192" cy="105" r="6" fill="#935f42"/></g>
<g id="map-jiangdong" class="map-marker">
  <rect x="678" y="208" width="115" height="42" rx="4" fill="transparent"/>
  <circle cx="695" cy="230" r="7" fill="#935f42"/>
  <text x="711" y="239" font-size="25" letter-spacing="4" fill="#34413b" font-family="Malgun Gothic, sans-serif">강동</text>
</g>
<g id="map-navy" class="map-marker">
  <rect x="792" y="173" width="164" height="42" rx="4" fill="transparent"/>
